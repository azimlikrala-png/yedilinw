<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yedili Network | Minecraft Sunucusu</title>
<link rel="icon" href="/logo.jpg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05080f;--panel:#0b1220;--panel2:#070c17;--line:#16264a;--blue:#2f8bff;--cyan:#5cc8ff;
  --text:#e8f0ff;--muted:#8da2c4;--input:#060b16;--head:rgba(5,8,15,.88);--chip:#13203d;--glow:rgba(47,139,255,.22);
  --gold:#ffcf5a;--goldbg:rgba(255,196,60,.12);--red:#ff7a7a;--redbg:rgba(255,80,80,.12);--rolecyan:#5cc8ff;--cyanbg:rgba(92,200,255,.12);
  --shadow:rgba(0,0,0,.6)
}
[data-theme="light"]{
  --bg:#f2f7ff;--panel:#ffffff;--panel2:#f6f9ff;--line:#cddcf5;--blue:#1f6fe0;--cyan:#0a7bc4;
  --text:#0b1630;--muted:#586a8c;--input:#f3f7ff;--head:rgba(242,247,255,.92);--chip:#e6eefc;--glow:rgba(47,139,255,.2);
  --gold:#9a6a00;--goldbg:rgba(255,196,60,.22);--red:#c23a3a;--redbg:rgba(255,80,80,.14);--rolecyan:#0a6fb0;--cyanbg:rgba(10,123,196,.12);
  --shadow:rgba(30,60,120,.25)
}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;
  background-image:radial-gradient(900px 500px at 50% -10%,var(--glow),transparent 70%),radial-gradient(600px 400px at 100% 100%,rgba(92,200,255,.08),transparent 70%);
  transition:background-color .25s,color .25s}
a{color:inherit;text-decoration:none}
[hidden]{display:none !important}

/* ÜST ÇUBUK */
header{position:sticky;top:0;z-index:10;background:var(--head);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px;margin-inline-end:auto}
.brand img{width:44px;height:44px;border-radius:50%;object-fit:cover;box-shadow:0 0 14px rgba(47,139,255,.6)}
.brand span{font-size:1.02rem}
.brand b{color:var(--cyan)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sel{position:relative;display:flex;align-items:center}
.sel select{appearance:none;-webkit-appearance:none;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 30px 9px 12px;font-size:.92rem;font-weight:600;cursor:pointer;max-width:170px}
[dir="rtl"] .sel select{padding:9px 12px 9px 30px}
.sel::after{content:"▾";position:absolute;inset-inline-end:10px;pointer-events:none;color:var(--muted);font-size:.8rem}
.sel select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,139,255,.2)}
.sel .ic{position:absolute;inset-inline-start:10px;pointer-events:none;font-size:.9rem}
.sel.has-ic select{padding-inline-start:32px}
.iconbtn{position:relative;margin:0;width:40px;height:40px;padding:0;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:1.1rem;cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--blue)}
.badge-dot{position:absolute;top:-5px;inset-inline-end:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#ff4d4d;color:#fff;font-size:.7rem;font-weight:800;display:grid;place-items:center}

/* İÇERİK */
main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:30px 16px 48px}
.hero{text-align:center;padding:20px 0 8px}
.hero .logo{width:150px;height:150px;border-radius:50%;object-fit:cover;box-shadow:0 0 40px rgba(47,139,255,.6);margin-bottom:18px}
h1{font-size:clamp(2rem,7vw,3.2rem);font-weight:900;letter-spacing:1px;line-height:1.1}
h1 .net{display:block;font-size:.4em;letter-spacing:.55em;color:var(--cyan);margin-top:8px}
.lead{color:var(--muted);max-width:480px;margin:16px auto 0;line-height:1.6}
.badge{display:inline-block;margin-top:18px;padding:7px 16px;border:1px solid var(--blue);border-radius:999px;color:var(--cyan);font-weight:700;font-size:.9rem;background:rgba(47,139,255,.1)}
h2.title{text-align:center;margin:40px 0 20px;font-size:1.4rem}
h2.title::after{content:"";display:block;width:60px;height:3px;margin:10px auto 0;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:20px;transition:.25s}
.card:hover{border-color:var(--blue);box-shadow:0 0 24px var(--glow);transform:translateY(-2px)}
.card h3{color:var(--cyan);margin-bottom:12px;font-size:1.1rem}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.row:last-of-type{border-bottom:0}
.row span:first-child{color:var(--muted)}
.row span:last-child{font-family:ui-monospace,Menlo,monospace;word-break:break-all;text-align:end}
button{font-family:inherit}
.btn{display:block;margin-top:14px;width:100%;padding:11px;border:0;border-radius:10px;background:linear-gradient(135deg,#1f6fe0,#2f8bff);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;transition:.2s;text-align:center}
.btn:hover{filter:brightness(1.15)}
.btn.discord{background:linear-gradient(135deg,#4752c4,#5865f2)}
.dc{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:space-between}
.dc .txt{flex:1 1 260px}
.dc h3{margin-bottom:6px}
.dc p{color:var(--muted);line-height:1.5}
.dc .btn{width:auto;min-width:190px;margin:0;padding:12px 22px}

/* YETKİLİLER */
.staff{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.member{text-align:center;padding:28px 20px}
.skin{width:96px;height:96px;margin:0 auto 14px;display:block;border-radius:14px;image-rendering:pixelated;border:2px solid var(--blue);box-shadow:0 0 20px rgba(47,139,255,.5);background:var(--chip)}
.role{display:inline-block;padding:5px 14px;border-radius:999px;font-weight:800;font-size:.8rem;letter-spacing:.12em;margin-bottom:12px}
.role.kurucu{background:var(--goldbg);color:var(--gold);border:1px solid rgba(255,196,60,.55)}
.role.admin{background:var(--redbg);color:var(--red);border:1px solid rgba(255,80,80,.55)}
.role.gelistirici{background:var(--cyanbg);color:var(--rolecyan);border:1px solid rgba(92,200,255,.55)}
.member .name{font-size:1.2rem;font-weight:800;word-break:break-all}

/* YAKINDA */
.soon{text-align:center;padding:44px 20px;max-width:520px;margin:30px auto 0}
.soon .big{font-size:2.6rem;margin-bottom:10px}
.soon h3{font-size:1.3rem;margin-bottom:10px}
.soon p{color:var(--muted);line-height:1.6}

/* DUYURU PANELİ */
.umenu,.bellwrap{position:relative}
.overlay{position:fixed;inset:0;z-index:20}
.dropdown{position:absolute;inset-inline-end:0;top:50px;z-index:30;min-width:240px;max-width:min(340px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 10px 40px var(--shadow)}
.dropdown .dname{padding:8px 10px 10px;font-weight:800;border-bottom:1px solid var(--line);margin-bottom:8px;word-break:break-all}
.dropdown .empty{padding:14px 10px;color:var(--muted);text-align:center}
.upd{padding:10px;border-bottom:1px solid var(--line)}
.upd:last-child{border-bottom:0}
.upd small{color:var(--muted)}
.upd b{display:block;margin:2px 0 4px}
.upd p{color:var(--muted);font-size:.92rem;line-height:1.45;white-space:pre-wrap}
.dropdown .btn{margin-top:4px;background:var(--chip);color:var(--text);border:1px solid var(--line);text-align:start;padding:10px 12px;font-size:.95rem}

footer{border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.85rem;padding:20px 16px}
footer a{color:var(--cyan);font-weight:700}

/* GİRİŞ / KAYIT (şu an kapalı: AUTH_ENABLED=false) */
.authwrap{display:grid;place-items:center;flex:1;width:100%;padding:24px 16px}
.authcard{width:100%;max-width:400px;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:26px 22px;box-shadow:0 0 40px var(--glow);text-align:center}
.authcard .logo{width:96px;height:96px;border-radius:50%;object-fit:cover;margin-bottom:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:5px;margin:20px 0 16px}
.tabs button{padding:10px;background:transparent;color:var(--muted);border:0;border-radius:8px;font-weight:700;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,#1f6fe0,#2f8bff);color:#fff}
form{text-align:left}
label{display:block;margin:12px 0 6px;color:var(--muted);font-size:.9rem;font-weight:600}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--text);font-size:1rem;outline:none}
.hint{color:var(--muted);font-size:.8rem;margin-top:6px}
.msg{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--redbg);border:1px solid rgba(255,80,80,.5);color:var(--red);font-size:.92rem}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px}
.avatarbtn{overflow:hidden;padding:0;border:2px solid var(--blue)}
.avatarbtn img{width:100%;height:100%;display:block;image-rendering:pixelated}

@media(max-width:560px){
  .brand span{display:none}
  .nav{gap:8px}
  .sel select{max-width:130px;font-size:.85rem}
}
/* ---- Faz 2 ek stiller ---- */
textarea,.fsel{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--input);color:var(--text);font-size:1rem;outline:none;font-family:inherit}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,.fsel:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,139,255,.2)}
form{text-align:start}
.authcard{text-align:center}
.btn.sm{display:inline-block;width:auto;margin:0;padding:9px 16px;font-size:.92rem}
.btn.ghost{background:var(--chip);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--redbg);color:var(--red);border:1px solid rgba(255,80,80,.5)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.ok{margin-top:14px;padding:10px 12px;border-radius:10px;background:rgba(60,200,120,.12);border:1px solid rgba(60,200,120,.5);color:#3cc878;font-size:.92rem}
.wrap{max-width:760px;margin:0 auto}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.bar h3{font-size:1.15rem}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.tk{display:block;width:100%;text-align:start;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;color:var(--text);cursor:pointer}
.tk:hover{border-color:var(--blue)}
.tk .l1{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700}
.tk .l2{color:var(--muted);font-size:.85rem;margin-top:6px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:800;white-space:nowrap}
.pill.open{background:rgba(60,200,120,.15);color:#3cc878;border:1px solid rgba(60,200,120,.5)}
.pill.closed{background:var(--chip);color:var(--muted);border:1px solid var(--line)}
.empty2{text-align:center;color:var(--muted);padding:30px 10px}
.bubble{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 14px;margin-bottom:10px;max-width:92%}
.bubble.staff{background:var(--cyanbg);border-color:rgba(92,200,255,.45);margin-inline-start:auto}
.bubble .who{font-size:.82rem;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bubble .who b{color:var(--text)}
.bubble .txt{white-space:pre-wrap;word-break:break-word;line-height:1.5}
.stag{background:var(--goldbg);color:var(--gold);border:1px solid rgba(255,196,60,.5);border-radius:999px;padding:1px 8px;font-size:.7rem;font-weight:800}
.fl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumb{max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--line);display:block;background:var(--input)}
.pick{margin-top:12px}
.pick .it{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 10px;margin-top:6px;border:1px solid var(--line);border-radius:8px;font-size:.88rem;word-break:break-all}
.pick .it button{background:none;border:0;color:var(--red);font-size:1rem;cursor:pointer}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.roles button{cursor:pointer;text-align:center;color:var(--text);font-size:1rem}
.roles .big{font-size:2rem;margin-bottom:6px}
.roles small{color:var(--muted);display:block;margin-top:6px}
.qn{margin-top:18px}
.qn .ql{font-weight:700;line-height:1.45;margin-bottom:8px;color:var(--text)}
.qn .ql small{color:var(--muted);font-weight:600}
.tabbar{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tabbar button{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:700;cursor:pointer}
.tabbar button.on{background:linear-gradient(135deg,#1f6fe0,#2f8bff);color:#fff;border-color:transparent}
.ans{border-top:1px solid var(--line);padding:12px 0}
.ans .ql{color:var(--cyan);font-weight:700;margin-bottom:4px}
.ans .av{white-space:pre-wrap;word-break:break-word}
.annit{padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.annit small{color:var(--muted)}
.annit p{white-space:pre-wrap;margin:4px 0 8px;color:var(--muted)}
.dropdown .btn.sm{width:100%;display:block;margin-top:6px}
.upd{white-space:normal}
</style>
</head>
<body>
<div id="app">

    <div class="nav">

            <option value="#/basvuru" data-i18n="apply"></option>

          <button type="button" class="iconbtn avatarbtn" id="avBtn"></button>
          <div class="overlay" id="ov" hidden></div>
          <div class="dropdown" id="dd" hidden>
            <div class="dname" id="dName"></div>
            <button type="button" class="btn sm ghost" id="pwBtn" data-i18n="changePw"></button>
            <button type="button" class="btn sm ghost" id="logoutBtn" data-i18n="logout"></button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="page-home">
    <section class="hero">
      <img class="logo" src="/logo.jpg" alt="Yedili Network">

      <span class="badge"><span data-i18n="version"></span>: 1.21.5x</span>

    <h2 class="title" data-i18n="howTo"></h2>
    <section class="cards">
      <div class="card">
        <h3>Java Edition</h3>
        <div class="row"><span data-i18n="address"></span><span>yedilinw.mangoohost.live</span></div>
        <button type="button" class="btn copy" data-i18n="copy"></button>
      </div>
      <div class="card">
        <h3>Bedrock Edition</h3>
        <div class="row"><span data-i18n="address"></span><span>yedilinw.mangoohost.live</span></div>
        <div class="row"><span data-i18n="port"></span><span>22992</span></div>
        <button type="button" class="btn copy" data-i18n="copy"></button>
      </div>
    </section>
    <section class="card dc" style="margin-top:22px">
      <div class="txt">
        <h3>💬 <span data-i18n="dcTitle"></span></h3>
        <p data-i18n="dcText"></p>
      </div>
      <a class="btn discord" href="https://discord.gg/yrwER5uSF" target="_blank" rel="noopener noreferrer" data-i18n="dcBtn"></a>
    </section>
  </main>

  <main id="page-staff" hidden>
    <h2 class="title" style="margin-top:8px" data-i18n="staffTitle"></h2>
    <section class="staff">
      <div class="card member">
        <img class="skin" data-skin="geckocraft88117" alt="geckocraft88117">
        <span class="role kurucu" data-i18n="roleFounder"></span>
        <div class="name">geckocraft88117</div>
      </div>
      <div class="card member">
        <img class="skin" data-skin="Eren_6331" alt="Eren_6331">
        <span class="role admin" data-i18n="roleAdmin"></span>
        <div class="name">Eren_6331</div>
      </div>
      <div class="card member">
        <img class="skin" data-skin=".alemdeVENOM" alt=".alemdeVENOM">
        <span class="role gelistirici" data-i18n="roleDev"></span>
        <div class="name">.alemdeVENOM</div>
      </div>
    </section>
  </main>

  <main id="page-support" hidden>
    <h2 class="title" style="margin-top:8px" data-i18n="support"></h2>
    <div class="wrap" id="supportBody"></div>
  </main>

  <main id="page-apply" hidden>
    <h2 class="title" style="margin-top:8px" data-i18n="apply"></h2>
    <div class="wrap" id="applyBody"></div>
  </main>

  <main id="page-panel" hidden>
    <h2 class="title" style="margin-top:8px">Yetkili Paneli</h2>
    <div class="wrap" id="panelBody"></div>
  </main>

  <footer>© Yedili Network · <a href="https://discord.gg/yrwER5uSF" target="_blank" rel="noopener noreferrer">Discord</a></footer>
</div>

var OK_EXT = { jpg: 1, jpeg: 1, png: 1, webp: 1, gif: 1, mp4: 1, webm: 1, mov: 1 };
var MIME_EXT = { "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp", "image/gif": "gif", "video/mp4": "mp4", "video/webm": "webm", "video/quicktime": "mov" };
function extOf(f) {
  var m = /\.([A-Za-z0-9]+)$/.exec(f.name || ""), e = m ? m[1].toLowerCase() : "";
  if (OK_EXT[e]) return e;
  return MIME_EXT[f.type] || "";
}
function filePicker(L, holder) {
  var inp = h("input", { type: "file", multiple: "multiple", hidden: "hidden", accept: "image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime" });
  var list = h("div"), err = h("div", { class: "msg", hidden: "hidden" });
  var btn = h("button", { type: "button", class: "btn sm ghost", text: "📎 " + T_("files", L), onclick: function () { inp.click(); } });
  function draw() {
    list.textContent = "";
    holder.forEach(function (f, i) {
      list.appendChild(h("div", { class: "it" }, [h("span", { text: f.name }), h("button", { type: "button", text: "✕", onclick: function () { holder.splice(i, 1); draw(); } })]));
    });
  }
  inp.onchange = function () {
    note(err, "");
    Array.prototype.forEach.call(inp.files, function (f) {
      if (holder.length >= 5) return note(err, T_("e_count", L));
      if (!extOf(f)) return note(err, T_("e_type", L));
      if (f.size > 50 * 1024 * 1024) return note(err, T_("e_toobig", L));
      holder.push(f);
    });
    inp.value = ""; draw();
  };
  draw();
  return h("div", { class: "pick" }, [btn, h("div", { class: "hint", text: T_("filesHint", L) }), inp, list, err]);
}
var blobLib = null;
function loadBlob() {
  if (!blobLib) blobLib = import("https://esm.sh/@vercel/blob/client").catch(function (e) { blobLib = null; throw e; });
  return blobLib;
}
function uploadAll(files, setStatus, L) {
  if (!files.length) return Promise.resolve([]);
  return loadBlob().then(function (lib) {
    var out = [], chain = Promise.resolve();
    files.forEach(function (f, i) {
      chain = chain.then(function () {
        setStatus(T_("uploading", L) + " " + (i + 1) + "/" + files.length);
        var path = "tickets/" + me.username + "/" + Date.now().toString(36) + "-" + i + "." + extOf(f);
        return lib.upload(path, f, { access: "private", handleUploadUrl: "/api/upload", multipart: true, contentType: f.type || undefined })
          .then(function (b) { out.push({ pathname: b.pathname, name: f.name, size: f.size }); });
      });
    });
    return chain.then(function () { return out; });
  });
}

function ticketView(box, id, o) {

  }
  load();
  clearPoll();
  pollTimer = setInterval(function () { if (!box.isConnected) return clearPoll(); if (!document.hidden) load(); }, 20000);
}

/* ============ YETKİLİ BAŞVURU ============ */
var ap = { role: "", vals: {}, done: false };
var ROLE_INFO = { rehber: ["roleRehber", "🧭"], moderator: ["roleMod", "🛡️"], asistan: ["roleAsistan", "🤝"] };
function renderApply() {
  var box = $("#applyBody");
  if (!gate(box, lang)) return;
  box.textContent = "";
  if (ap.done) {
    box.appendChild(h("div", { class: "card", style: "text-align:center" }, [h("div", { class: "ok", text: t("appSent") }),
      h("button", { class: "btn", type: "button", text: t("back"), onclick: function () { ap = { role: "", vals: {}, done: false }; renderApply(); } })]));
    return;
  }
  if (!ap.role) {
    box.appendChild(h("h3", { text: t("chooseRole"), style: "text-align:center;margin-bottom:16px" }));
    var g = h("div", { class: "roles" });
    Object.keys(ROLE_INFO).forEach(function (r) {
      g.appendChild(h("button", { type: "button", class: "card", onclick: function () { ap.role = r; ap.vals = {}; renderApply(); window.scrollTo(0, 0); } }, [
        h("div", { class: "big", text: ROLE_INFO[r][1] }), h("b", { text: t(ROLE_INFO[r][0]) }), h("small", { text: FORMS[r].length + " " + t("qCount") })]));
    });
    box.appendChild(g);
    return;
  }
  var keys = FORMS[ap.role], inputs = [];
  var msg = h("div", { class: "msg", hidden: "hidden" });
  box.appendChild(h("div", { class: "bar" }, [h("h3", { text: t(ROLE_INFO[ap.role][0]) }), h("button", { class: "btn sm ghost", type: "button", text: "← " + t("back"), onclick: function () { ap.role = ""; renderApply(); } })]));
  var form = h("form", { class: "card" });
  keys.forEach(function (k, i) {
    var short = ["name", "age", "mc", "discord", "hours"].indexOf(k) >= 0;
    var el = h(short ? "input" : "textarea", { maxlength: short ? "100" : "1500", style: short ? "" : "min-height:90px" });
    el.value = ap.vals[k] || "";
    el.oninput = function () { ap.vals[k] = el.value; };
    inputs.push(el);
    form.appendChild(h("div", { class: "qn" }, [h("div", { class: "ql" }, [(i + 1) + ". " + qt(k), i === 0 ? h("small", { text: " (" + t("optionalTag") + ")" }) : null]), el]));
  });
  var btn = h("button", { class: "btn", type: "submit", text: t("sendApp") });
  form.appendChild(msg); form.appendChild(btn);
  form.onsubmit = function (e) {
    e.preventDefault(); note(msg, "");
    var answers = keys.map(function (k) { return (ap.vals[k] || "").trim(); });
    for (var i = 1; i < answers.length; i++) if (!answers[i]) { inputs[i].focus(); return note(msg, t("requiredFill")); }
    btn.disabled = true;
    call("/api/app", { action: "app.submit", role: ap.role, answers: answers, lang: lang }).then(function (r) {
      btn.disabled = false;
      if (lostAuth(r)) return;
      if (!r.ok) return note(msg, errMsg(r.d));
      ap.done = true; renderApply(); window.scrollTo(0, 0);
    });
  };
  box.appendChild(form);
}

/* ============ YETKİLİ PANELİ (sadece Türkçe) ============ */
var pn = { tab: "tickets", ticket: 0, app: 0 };
function renderPanel() {
  var box = $("#panelBody"), L = "tr";
  if (!gate(box, L)) return;
  box.textContent = "";
  if (!me.staff) return box.appendChild(h("div", { class: "msg", text: "Bu sayfaya erişim yetkin yok." }));
  var tabs = h("div", { class: "tabbar" }, [["tickets", "🎫 Talepler"], ["apps", "📝 Başvurular"], ["ann", "📢 Duyurular"]].map(function (x) {
    return h("button", { type: "button", class: pn.tab === x[0] ? "on" : "", text: x[1], onclick: function () { pn.tab = x[0]; pn.ticket = 0; pn.app = 0; renderPanel(); } });
  }));
  box.appendChild(tabs);
  var body = h("div"); box.appendChild(body);
  if (pn.tab === "tickets") {
    if (pn.ticket) return ticketView(body, pn.ticket, { L: L, back: function () { pn.ticket = 0; renderPanel(); } });
    call("/api/app", { action: "ticket.list", scope: "all" }).then(function (r) {
      if (lostAuth(r)) return;
      if (!r.ok) return body.appendChild(h("div", { class: "msg", text: errMsg(r.d, L) }));
      if (!r.d.items.length) return body.appendChild(h("div", { class: "empty2", text: T_("noTickets", L) }));
      r.d.items.forEach(function (x) { body.appendChild(ticketRow(x, L, function () { pn.ticket = x.id; renderPanel(); })); });
    });
  } else if (pn.tab === "apps") {
    if (pn.app) return appDetail(body, pn.app);
    call("/api/app", { action: "app.list" }).then(function (r) {
      if (lostAuth(r)) return;
      if (!r.ok) return body.appendChild(h("div", { class: "msg", text: errMsg(r.d, L) }));
      if (!r.d.items.length) return body.appendChild(h("div", { class: "empty2", text: "Henüz başvuru yok." }));
      r.d.items.forEach(function (x) {
        body.appendChild(h("button", { type: "button", class: "tk", onclick: function () { pn.app = x.id; renderPanel(); } }, [
          h("div", { class: "l1" }, [h("span", { text: "#" + x.id + " · " + x.owner }), h("span", { class: "pill open", text: T_(ROLE_INFO[x.role] ? ROLE_INFO[x.role][0] : "apply", L) })]),
          h("div", { class: "l2", text: fmt(x.at, L) })]));
      });
    });
  } else annPanel(body);
}
function appDetail(body, id) {
  body.appendChild(h("div", { class: "bar" }, [h("button", { class: "btn sm ghost", type: "button", text: "← Geri", onclick: function () { pn.app = 0; renderPanel(); } })]));
  var card = h("div", { class: "card" }); body.appendChild(card);
  call("/api/app", { action: "app.get", id: id }).then(function (r) {
    if (lostAuth(r)) return;
    if (!r.ok) return card.appendChild(h("div", { class: "msg", text: errMsg(r.d, "tr") }));
    var it = r.d.item, keys = FORMS[it.role] || [];
    card.appendChild(h("h3", { text: "#" + it.id + " · " + it.owner + " · " + T_(ROLE_INFO[it.role] ? ROLE_INFO[it.role][0] : "apply", "tr") }));
    card.appendChild(h("div", { class: "hint", text: fmt(it.at, "tr") + " · Dil: " + it.lang }));
    keys.forEach(function (k, i) {
      card.appendChild(h("div", { class: "ans" }, [h("div", { class: "ql", text: (i + 1) + ". " + qt(k, "tr") }), h("div", { class: "av", text: it.answers[i] || "—" })]));
    });
  });
}
function annPanel(body) {
  var ti = h("input", { maxlength: "100", placeholder: "Başlık" });
  var tx = h("textarea", { maxlength: "2000", placeholder: "Duyuru metni" });
  var msg = h("div", { class: "msg", hidden: "hidden" });
  var btn = h("button", { class: "btn", type: "submit", text: "Duyuru Yayınla" });
  var list = h("div", { style: "margin-top:20px" });
  function refresh() {
    call("/api/app", { action: "bell" }).then(function (r) {
      if (!r.ok) return;
      ANN = r.d.items; renderBell(); list.textContent = "";
      if (!ANN.length) list.appendChild(h("div", { class: "empty2", text: "Henüz duyuru yok." }));
      ANN.forEach(function (u) {
        list.appendChild(h("div", { class: "annit" }, [h("small", { text: fmt(u.at, "tr") + " · " + u.author }), h("b", { text: u.title, style: "display:block" }), h("p", { text: u.body }),
          h("button", { class: "btn sm danger", type: "button", text: "Sil", onclick: function () {
            if (!confirm("Bu duyuru silinsin mi?")) return;
            call("/api/app", { action: "ann.delete", id: u.id }).then(function (r2) { if (!lostAuth(r2)) refresh(); });
          } })]));
      });
    });
  }
  body.appendChild(h("form", { class: "card", onsubmit: function (e) {
    e.preventDefault(); note(msg, "");
    btn.disabled = true;
    call("/api/app", { action: "ann.create", title: ti.value, body: tx.value }).then(function (r) {
      btn.disabled = false;
      if (lostAuth(r)) return;
      if (!r.ok) return note(msg, errMsg(r.d, "tr"));
      ti.value = ""; tx.value = ""; note(msg, "Duyuru yayınlandı.", true); refresh();
    });
  } }, [field("Başlık", ti), field("Metin", tx), msg, btn]));
  body.appendChild(list); refresh();
}

var SRV = null;
function renderOnline() {
  var b = $("#onlineBadge"); if (!b) return;
  if (!SRV) b.textContent = "…";
  else if (!SRV.ok) b.textContent = t("statusFail");
  else if (!SRV.online) b.textContent = "🔴 " + t("serverOffline");
  else b.textContent = "🟢 " + t("playersOnline") + ": " + SRV.players + (SRV.max ? " / " + SRV.max : "");
}
function loadOnline() {
  fetch("/api/status").then(function (r) { return r.json(); }).then(function (d) { SRV = d; renderOnline(); }).catch(function () { SRV = { ok: false }; renderOnline(); });
}
setInterval(loadOnline, 60000);

/* ============ BAŞLAT ============ */
applyLang();
route(false);
loadBell();
loadOnline();
setInterval(loadBell, 120000);
loadMe(function () { route(true); });
